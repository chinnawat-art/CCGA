<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#6366f1">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" href="icons/icon-180.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Alu ERP">
    <script src="pwa.js?v=20260918-2" defer></script>
    <title>คลังบานสำเร็จ | Panel Stock</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="auth.js?v=20261104-1"></script>
    <link rel="stylesheet" href="theme.css">
    <script src="theme.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        body { margin:0; font-family:'Kanit',sans-serif;
               background: var(--bg-body,#f1f5f9); color: var(--text-main,#0f172a); }
        .shell { max-width:960px; margin:0 auto; padding:16px 14px 90px; }
        .back { color: var(--muted-strong,#64748b); text-decoration:none; font-size:.92rem; }
        h1 { font-size:1.35rem; margin:10px 0 2px; }
        h2 { font-size:1.05rem; margin:0 0 10px; }
        .sub { color: var(--muted-strong,#64748b); font-size:.88rem; margin:0 0 14px; }
        .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(120px, 1fr)); gap:9px; margin-bottom:14px; }
        .kpi { background: var(--surface,#fff); border:1px solid var(--border-strong,#e2e8f0);
               border-radius:14px; padding:11px 8px; text-align:center; }
        .kpi b { display:block; font-size:1.4rem; line-height:1.25; color:#2563eb; }
        .kpi span { font-size:.74rem; color: var(--muted-strong,#64748b); }
        .card { background: var(--surface,#fff); border:1px solid var(--border-strong,#e2e8f0);
                border-radius:15px; padding:14px; margin-bottom:12px; }
        .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
        .toolbar input, .toolbar select { font-family:inherit; font-size:.95rem; padding:10px 12px;
               border:1px solid var(--border-strong,#cbd5e1); border-radius:11px;
               background: var(--surface,#fff); color: var(--text-main,#0f172a); }
        .toolbar input { flex:1 1 220px; min-width:0; }
        .toolbar select { flex:0 1 190px; }
        .btn { padding:7px 11px; border:1px solid var(--border-strong,#cbd5e1); border-radius:10px; cursor:pointer;
               font:600 .85rem 'Kanit',sans-serif; background:transparent; color: var(--text-main,#0f172a); }
        .sku { border:1px solid var(--border-strong,#e2e8f0); border-radius:13px; padding:11px 12px; margin-bottom:9px; }
        .sku-head { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap; }
        .sku-code { font-weight:700; }
        .meta { font-size:.82rem; color: var(--muted-strong,#64748b); line-height:1.5; }
        .ps-row { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
                  padding:8px 0 0; margin-top:8px; border-top:1px dashed var(--border-strong,#e2e8f0); }
        .ps-qty { font-size:1.3rem; font-weight:800; color:#2563eb; min-width:44px; text-align:center; }
        .ps-actions { display:flex; gap:6px; align-items:center; }
        .loc { display:inline-block; padding:0 7px; border-radius:6px; background:#0f766e; color:#fff; font-weight:700; font-size:.78rem; }
        .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:.78rem; font-weight:700;
                background: rgba(37,99,235,.14); color:#2563eb; }
        .log-row { display:flex; justify-content:space-between; gap:10px; border-bottom:1px solid var(--border-strong,#e2e8f0);
                   padding:8px 2px; font-size:.85rem; }
        .log-row:last-child { border-bottom:0; }
        .up { color:#16a34a; font-weight:800; } .down { color:#dc2626; font-weight:800; }
        .empty { text-align:center; padding:26px 12px; color: var(--muted-strong,#64748b); }
        .toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
                background:#0f172a; color:#fff; padding:12px 20px; border-radius:13px;
                font-size:.92rem; z-index:9999; box-shadow:0 12px 30px rgba(0,0,0,.3);
                max-width:calc(100vw - 32px); text-align:center; }
    </style>
</head>
<body>
    <div class="shell">
        <a href="returns.html" class="back">← ไปหน้าของตีกลับ (เก็บบานเข้าคลัง)</a>
        <h1>🪟 คลังบานสำเร็จ</h1>
        <p class="sub">บานที่ยังดีจากของตีกลับ แยกบานตาย / บานเลื่อน · ใช้กับงานใหม่ SKU เดียวกันได้ ทำแค่กรอบ + บานที่ขาด</p>

        <div id="user-display-area"></div>

        <div class="kpis">
            <div class="kpi"><b id="kTotal">-</b><span>บานในคลังทั้งหมด</span></div>
            <div class="kpi"><b id="kSku">-</b><span>จำนวน SKU</span></div>
            <div class="kpi"><b id="kFixed">-</b><span>บานตาย</span></div>
            <div class="kpi"><b id="kSlide">-</b><span>บานเลื่อน</span></div>
            <div class="kpi"><b id="kNoLoc" style="color:#d97706">-</b><span>ยังไม่ระบุช่องเก็บ</span></div>
        </div>

        <div class="card">
            <h2>📋 บานในคลัง</h2>
            <div class="toolbar">
                <input id="q" type="text" placeholder="🔍 ค้นหา SKU ชื่อสินค้า หรือช่องเก็บ" autocomplete="off">
                <select id="fam">
                    <option value="">ทุกรุ่น</option>
                    <option value="SLWD2P">หน้าต่าง 2 บาน</option>
                    <option value="SLWD3P">หน้าต่าง 3 บาน</option>
                    <option value="SLWD4P">หน้าต่าง 4 บาน</option>
                    <option value="SLD2P">ประตู 2 บาน</option>
                    <option value="SLD4P">ประตู 4 บาน</option>
                </select>
            </div>
            <div id="list"><div class="empty">กำลังโหลด...</div></div>
        </div>

        <div class="card">
            <h2>🕘 ความเคลื่อนไหวล่าสุด</h2>
            <div id="log"><div class="empty">กำลังโหลด...</div></div>
        </div>
    </div>

<script>
    const PANEL_LABEL = { fixed: 'บานตาย', slide: 'บานเลื่อน', slide_handle: 'บานเลื่อนฝั่งมือจับ', slide_plain: 'บานเลื่อนฝั่งเรียบ' };
    const PANEL_ORDER = ['fixed', 'slide', 'slide_handle', 'slide_plain'];
    // จำนวนบานต่อชุด (ตรงกับ panel_layout ในฐานข้อมูล)
    const PANEL_LAYOUT = {
        SLWD2P: { slide: 2 }, SLD2P: { slide: 2 },
        SLWD3P: { fixed: 1, slide: 2 },
        SLWD4P: { fixed: 2, slide_handle: 1, slide_plain: 1 },
        SLD4P: { fixed: 2, slide_handle: 1, slide_plain: 1 }
    };
    let db = null, rows = [], names = {};

    function esc(s) {
        return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
    }
    function toast(msg, ms) {
        const t = document.createElement('div');
        t.className = 'toast'; t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), ms || 3000);
    }
    function fmtDate(v) {
        return v ? new Date(v).toLocaleString('th-TH', { hour12:false, day:'2-digit', month:'short', year:'2-digit', hour:'2-digit', minute:'2-digit' }) : '-';
    }
    function panelFamily(sku) { const m = String(sku || '').match(/^(SLWD|SLD)\dP/); return m ? m[0] : null; }
    function normalizeLoc(v) {
        return String(v || '').replace(/\s+/g, '').toUpperCase().replace(/^([A-Z]+)-?0*(\d{1,3})$/, (m, a, b) => a + b.padStart(2, '0'));
    }

    async function loadStock() {
        const { data, error } = await db.from('panel_stock')
            .select('product_code, panel_type, quantity, storage_location, updated_at')
            .gt('quantity', 0).order('product_code').limit(1000);
        if (error) { document.getElementById('list').innerHTML = '<div class="empty">โหลดคลังบานไม่สำเร็จ: ' + esc(error.message) + '</div>'; return; }
        rows = data || [];
        const codes = [...new Set(rows.map(r => r.product_code))].filter(c => !(c in names));
        if (codes.length) {
            const { data: sk } = await db.from('sku_master').select('product_code, name').in('product_code', codes);
            (sk || []).forEach(s => { names[s.product_code] = s.name || ''; });
        }
        render();
    }

    function render() {
        const q = String(document.getElementById('q').value || '').trim().toLowerCase();
        const fam = document.getElementById('fam').value;
        const total = rows.reduce((s, r) => s + r.quantity, 0);
        document.getElementById('kTotal').textContent = total.toLocaleString('th-TH');
        document.getElementById('kSku').textContent = new Set(rows.map(r => r.product_code)).size;
        document.getElementById('kFixed').textContent = rows.filter(r => r.panel_type === 'fixed').reduce((s, r) => s + r.quantity, 0);
        document.getElementById('kSlide').textContent = rows.filter(r => r.panel_type !== 'fixed').reduce((s, r) => s + r.quantity, 0);
        document.getElementById('kNoLoc').textContent = rows.filter(r => !r.storage_location).reduce((s, r) => s + r.quantity, 0);

        const shown = rows.filter(r => (!fam || panelFamily(r.product_code) === fam)
            && (!q || r.product_code.toLowerCase().includes(q) || String(names[r.product_code] || '').toLowerCase().includes(q)
                   || String(r.storage_location || '').toLowerCase().includes(q)));
        const box = document.getElementById('list');
        if (!shown.length) { box.innerHTML = '<div class="empty">' + (rows.length ? 'ไม่พบตามที่ค้นหา' : 'ยังไม่มีบานในคลัง<br><small>เก็บบานได้จากหน้าของตีกลับ → เลือก เสียหาย → 🪟 เก็บบานที่ดี</small>') + '</div>'; return; }

        const bySku = {};
        shown.forEach(r => { (bySku[r.product_code] = bySku[r.product_code] || []).push(r); });
        box.innerHTML = Object.keys(bySku).sort().map(code => {
            const layout = PANEL_LAYOUT[panelFamily(code)] || {};
            const set = Object.entries(layout).map(([t, n]) => PANEL_LABEL[t] + ' ' + n).join(' + ');
            return '<div class="sku"><div class="sku-head"><div>'
                + '<div class="sku-code">' + esc(code) + '</div>'
                + (names[code] ? '<div class="meta">' + esc(names[code]) + '</div>' : '')
                + (set ? '<div class="meta">1 ชุดใช้: ' + set + '</div>' : '')
                + '</div></div>'
                + bySku[code].sort((a, b) => PANEL_ORDER.indexOf(a.panel_type) - PANEL_ORDER.indexOf(b.panel_type)).map(r =>
                    '<div class="ps-row"><div><span class="pill">' + (PANEL_LABEL[r.panel_type] || r.panel_type) + '</span> '
                    + (r.storage_location ? '<span class="loc">📍 ' + esc(r.storage_location) + '</span>' : '<span class="meta">ยังไม่ระบุช่อง</span>')
                    + '<div class="meta">อัปเดต ' + fmtDate(r.updated_at) + '</div></div>'
                    + '<div class="ps-actions"><span class="ps-qty">' + r.quantity + '</span>'
                    + '<button class="btn" data-move="' + esc(code) + '|' + r.panel_type + '" title="ย้ายช่องเก็บ">📍 ย้าย</button>'
                    + '<button class="btn" data-minus="' + esc(code) + '|' + r.panel_type + '" title="ลดยอด เช่น บานในคลังเสีย">−1</button></div></div>'
                ).join('')
                + '</div>';
        }).join('');
    }

    async function loadLog() {
        const { data, error } = await db.from('panel_stock_log')
            .select('product_code, panel_type, old_qty, new_qty, reason, operator, created_at')
            .order('created_at', { ascending: false }).limit(50);
        const box = document.getElementById('log');
        if (error) { box.innerHTML = '<div class="empty">โหลดประวัติไม่สำเร็จ: ' + esc(error.message) + '</div>'; return; }
        if (!data || !data.length) { box.innerHTML = '<div class="empty">ยังไม่มีความเคลื่อนไหว</div>'; return; }
        box.innerHTML = data.map(l => {
            const d = l.new_qty - l.old_qty;
            return '<div class="log-row"><div><b>' + esc(l.product_code) + '</b> · ' + (PANEL_LABEL[l.panel_type] || l.panel_type)
                + '<div class="meta">' + esc(l.reason || '-') + '<br>' + esc(l.operator || '-') + ' · ' + fmtDate(l.created_at) + '</div></div>'
                + '<div style="text-align:right;white-space:nowrap;">' + (d ? '<span class="' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '') + d + '</span>' : '<span class="meta">ย้ายช่อง</span>')
                + '<div class="meta">' + l.old_qty + ' → ' + l.new_qty + '</div></div></div>';
        }).join('');
    }

    async function adjust(key, delta) {
        const [code, type] = key.split('|');
        let reason = null, loc = null;
        if (delta) {
            reason = prompt('ลด ' + (PANEL_LABEL[type] || type) + ' ของ ' + code + ' 1 บาน\nเหตุผล (เช่น บานในคลังมีรอย / นับแล้วไม่ตรง):', '');
            if (reason === null) return;
            if (reason.trim().length < 3) { toast('กรุณาใส่เหตุผลอย่างน้อย 3 ตัวอักษร'); return; }
        } else {
            loc = prompt('ย้าย ' + (PANEL_LABEL[type] || type) + ' ของ ' + code + ' ไปช่องไหน (เช่น P02):', '');
            if (loc === null) return;
            loc = normalizeLoc(loc);
            if (!loc) { toast('กรุณาใส่ช่องเก็บ'); return; }
        }
        const { error } = await db.rpc('rpc_adjust_panel_stock', { p_product_code: code, p_panel_type: type, p_delta: delta, p_reason: reason, p_location: loc });
        if (error) { toast('❌ ' + error.message, 5000); return; }
        toast(delta ? '✅ ลดยอดแล้ว' : '✅ ย้ายช่องเก็บแล้ว');
        loadStock();
        loadLog();
    }

    window.addEventListener('auth-ready', () => {
        db = window.auth && window.auth.supabase;
        if (!db) { document.getElementById('list').innerHTML = '<div class="empty">❌ เชื่อมต่อฐานข้อมูลไม่ได้</div>'; return; }
        loadStock();
        loadLog();
        document.getElementById('q').addEventListener('input', render);
        document.getElementById('fam').addEventListener('change', render);
        document.getElementById('list').addEventListener('click', e => {
            const m = e.target.closest('[data-move]'), d = e.target.closest('[data-minus]');
            if (m) adjust(m.dataset.move, 0);
            if (d) adjust(d.dataset.minus, -1);
        });
    });
</script>
</body>
</html>
